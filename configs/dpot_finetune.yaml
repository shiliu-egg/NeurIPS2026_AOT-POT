name: NS2d
file: finetune.py
device: '0,1,2,3,4,5,6,7'        # Eligible GPUs; each fine-tuning task uses one GPU
model: DPOT
dataset: ns2d
use_writer: True
res: 128
modes: 32
patch_size: 8
lr: 0.001
lr_method: cycle
warmup_epochs: 40
step_size: 100
step_gamma: 0.5
epochs: 1001
noise_scale: 0.0005
T_ar: 1
use_ln: 1
normalize: 0
T_bundle: 1
grad_clip: 10000.0
beta1: 0.9
beta2: 0.9
n_channels: 4
n_class: 12

##########################################
############ Pointwise MLP transform
##########################################
# add_mlp: 1
# mlp_hidden: 4
# freeze_mlp: 1
# load_mlp_path: "/mnt/shared-storage-user/brainllm-share/lvqitan/brainllm2-share/lvqitan/fine_tune_mhc_mlp_medium_model/DPOT_ns2d_0419_10_46_40S_1_9000/model.pth"

##########################################
############ Tiny models
##########################################
resume_path: 'path to your pretrained ckpt'
load_components: ['all']
n_layers: 4
n_blocks: 4
mlp_ratio: 1
width: 512
use_mhc: 0
n_streams: 4
sinkhorn_iter: 20
alpha_init: 0.01
complex_norm: 0
sandwich_norm: 0
use_layer_scale: 0
use_far: 0

