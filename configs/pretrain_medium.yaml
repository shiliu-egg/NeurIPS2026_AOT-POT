##########################################################
########## Medium model
##########################################################
model: DPOT
num_gpus: 8
opt: adam
data_weights: [8,2,8,1,1,1,1,20,20,1,3,1]
comment: 'M'
tasks:
  normalize: [0]
  res: [128]
  patch_size: [8]
  noise_scale: [0.0005]
  modes: [32]
  width: [1024]
  mlp_ratio: [4]
  n_blocks: [8]
  n_layers: [12]
  lr: [0.001]
  # resume_path: '/mnt/shared-storage-user/brainllm-share/lvqitan/brainllm2-share/lvqitan/·logs_pretrain/DPOT_ns2d_0305_19_00_22:M_12_132400/model_19.pth'
  epochs: [5001]
  lr_method: [cycle]
  warmup_epochs: [100]
  T_ar: [1]
  T_bundle: [1]
  beta1: [0.9]
  beta2: [0.9]
  batch_size: [160]


  # mHC (Manifold-Constrained Hyper-Connections) parameters
  use_mhc: [1]           # 1 to enable mHC, 0 to disable
  n_streams: [4]         # Number of parallel streams (paper uses 4)
  sinkhorn_iter: [20]    # Sinkhorn iterations (paper uses 20)
  alpha_init: [0.01]     # Gating scalar initialization (paper uses 0.01)
  # Spectrum-aware noise injection parameters
  adaptive_noise: [0]    # 1 to enable spectrum-aware noise, 0 for isotropic noise
  noise_decay_power: [1]  # Frequency decay power (higher = faster high-freq decay)
  # EMA (Exponential Moving Average) parameters
  use_ema: [0]           # 1 to enable EMA, 0 to disable
  ema_decay: [0.999]     # EMA decay rate (0.999 means ~1000 steps averaging window)
  # Normalization enhancement parameters
  complex_norm: [1]      # 1 to enable ComplexGroupNorm in AFNO2D frequency domain, 0 to disable
  sandwich_norm: [1]     # 1 to enable Sandwich-Norm (pre+post norm) in Block/MHCBlock, 0 to disable
  # Layer Scale and Frequency-Aware Residual (small innovations)
  use_layer_scale: [0]   # 1 to enable Layer Scale (learnable scaling on residual branches), 0 to disable
  use_far: [0]           #
